<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#cyberBg)" />

  <!-- Neon cyber grid lines -->
  <line x1="0" y1="180" x2="400" y2="180" stroke="rgba(56, 189, 248, 0.2)" stroke-dasharray="6,6" />
  <line x1="0" y1="210" x2="400" y2="210" stroke="rgba(56, 189, 248, 0.2)" stroke-dasharray="6,6" />

  <!-- Saki Maid Character Center Left -->
  <g transform="translate(40, 25)">
    <!-- Cyber Maid Headband -->
    <path d="M40 45 C40 20, 120 20, 120 45 L125 55 L35 55 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
    <circle cx="80" cy="32" r="8" fill="#38bdf8" />
    <circle cx="80" cy="85" r="50" fill="url(#hairGrad)" />
    <ellipse cx="80" cy="90" rx="38" ry="36" fill="#ffe4e6" />
    <path d="M44 70 C55 90, 65 72, 80 82 C95 72, 105 90, 116 70 C120 110, 40 110, 44 70 Z" fill="url(#hairGrad)" />
    <!-- Happy Eyes -->
    <path d="M60 88 Q65 82 70 88" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
    <path d="M90 88 Q95 82 100 88" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="58" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="102" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.45" />
    <path d="M72 96 Q80 108 88 96 Z" fill="#e11d48" />
    <!-- Maid Collar -->
    <path d="M60 126 L80 142 L100 126 L90 148 L70 148 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="80" cy="144" r="3" fill="#38bdf8" />
  </g>

  <!-- Right text and feature tags -->
  <text x="210" y="65" fill="#ffffff" font-size="18" font-family="system-ui" font-weight="700">赛博女仆 Saki 皮肤</text>
  <text x="210" y="90" fill="#93c5fd" font-size="12" font-family="system-ui">专为 Saki Panel 设计的可爱女仆装</text>

  <rect x="210" y="110" width="160" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="220" y="127" fill="#38bdf8" font-size="11" font-family="system-ui">✨ 包含 6+ 套专属表情立绘</text>

  <rect x="210" y="145" width="160" height="26" rx="6" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.3)" />
  <text x="220" y="162" fill="#a5b4fc" font-size="11" font-family="system-ui">🐾 顶栏趴卧/打瞌睡桌面宠物</text>

  <rect x="210" y="180" width="160" height="26" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.3)" />
  <text x="220" y="197" fill="#f472b6" font-size="11" font-family="system-ui">⚡ 全站无感热插拔切换</text>
</svg>
