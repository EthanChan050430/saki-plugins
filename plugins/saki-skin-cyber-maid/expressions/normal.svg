  <ellipse cx="95" cy="88" rx="5" ry="7" fill="#1e1b4b" />
  <circle cx="97" cy="86" r="2" fill="#ffffff" />
  <!-- Blush -->
  <ellipse cx="58" cy="96" rx="6" ry="3" fill="#f43f5e" opacity="0.3" />
  <ellipse cx="102" cy="96" rx="6" ry="3" fill="#f43f5e" opacity="0.3" />
  <!-- Smile -->
  <path d="M74 98 Q80 104 86 98" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
  <!-- Maid Collar -->
  <path d="M60 126 L80 142 L100 126 L90 148 L70 148 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="80" cy="144" r="3" fill="#38bdf8" />
