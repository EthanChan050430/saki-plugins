  <!-- Hair bangs -->
  <path d="M44 70 C55 90, 65 72, 80 82 C95 72, 105 90, 116 70 C120 110, 40 110, 44 70 Z" fill="url(#hairGrad)" />
  <!-- Looking Up Thinking Eyes -->
  <ellipse cx="65" cy="84" rx="5" ry="7" fill="#1e1b4b" />
  <circle cx="67" cy="81" r="2" fill="#ffffff" />
  <ellipse cx="95" cy="84" rx="5" ry="7" fill="#1e1b4b" />
  <circle cx="97" cy="81" r="2" fill="#ffffff" />
  <!-- O mouth -->
  <circle cx="80" cy="100" r="4" fill="#e11d48" />
  <!-- Holographic Question Mark -->
  <text x="115" y="65" fill="#38bdf8" font-size="24" font-weight="bold" font-family="system-ui">?</text>
