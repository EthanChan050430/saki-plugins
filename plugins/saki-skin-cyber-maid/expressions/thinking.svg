      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
  </defs>
  <!-- Cyber Maid Headband -->
  <path d="M40 45 C40 20, 120 20, 120 45 L125 55 L35 55 Z" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <circle cx="80" cy="32" r="8" fill="#38bdf8" />
