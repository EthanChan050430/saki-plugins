<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f111a" />
      <stop offset="50%" stop-color="#2d1526" />
      <stop offset="100%" stop-color="#1a0d16" />
    </linearGradient>
    <linearGradient id="sakuraPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)" />

  <!-- Window Header -->
  <rect x="0" y="0" width="400" height="36" rx="16" fill="rgba(255,255,255,0.06)" />
  <circle cx="20" cy="18" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="36" cy="18" r="5" fill="#fbbf24" opacity="0.8" />
  <circle cx="52" cy="18" r="5" fill="#34d399" opacity="0.8" />
  <text x="75" y="22" fill="#fbcfe8" font-size="12" font-family="system-ui, sans-serif" font-weight="600">Saki Panel — 🌸 Sakura Dream</text>

  <!-- Sidebar Mock -->
  <rect x="14" y="50" width="80" height="175" rx="10" fill="rgba(244,114,182,0.08)" stroke="rgba(244,114,182,0.2)" />
  <rect x="22" y="62" width="64" height="18" rx="6" fill="url(#sakuraPink)" opacity="0.9" />
  <rect x="22" y="88" width="64" height="14" rx="4" fill="rgba(255,255,255,0.15)" />
  <rect x="22" y="108" width="64" height="14" rx="4" fill="rgba(255,255,255,0.15)" />
  <rect x="22" y="128" width="64" height="14" rx="4" fill="rgba(255,255,255,0.15)" />

  <!-- Main Content Card Mock -->
  <rect x="106" y="50" width="280" height="110" rx="12" fill="rgba(255,240,246,0.08)" stroke="rgba(244,114,182,0.3)" filter="url(#glow)" />
  <text x="122" y="78" fill="#fff1f5" font-size="15" font-family="system-ui, sans-serif" font-weight="700">樱花梦境主题</text>
  <text x="122" y="98" fill="#fbcfe8" font-size="11" font-family="system-ui, sans-serif">唯美通透的粉白配色，伴你温暖写代码</text>

  <rect x="122" y="116" width="76" height="26" rx="6" fill="url(#sakuraPink)" />
  <text x="138" y="133" fill="#fff" font-size="11" font-family="system-ui, sans-serif" font-weight="600">已激活</text>

  <!-- Sub Cards -->
  <rect x="106" y="170" width="134" height="55" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(244,114,182,0.2)" />
  <rect x="252" y="170" width="134" height="55" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(244,114,182,0.2)" />

  <!-- Floating Sakura Petals -->
  <path d="M350 45 C352 38, 362 38, 364 45 C366 52, 355 58, 350 45 Z" fill="#f472b6" opacity="0.6" />
  <path d="M320 80 C322 75, 330 75, 332 80 C333 85, 325 89, 320 80 Z" fill="#fbcfe8" opacity="0.7" />
  <path d="M280 40 C282 35, 290 35, 292 40 C293 45, 285 49, 280 40 Z" fill="#f472b6" opacity="0.5" />
</svg>
