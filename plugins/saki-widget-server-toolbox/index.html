<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>极客运维工具箱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121319; color: #e2e8f0; padding: 14px; font-size: 13px; user-select: none; }
    .tabs { display: flex; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px; }
    .tab-btn { background: transparent; border: none; color: #94a3b8; font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .tab-btn:hover { color: #f8fafc; background: rgba(255,255,255,0.06); }
    .tab-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.12); font-weight: 600; }
    .pane { display: none; }
    .pane.active { display: block; }
    /* Commands list */
    .cmd-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
    .cmd-text { font-family: ui-monospace, SFMono-Regular, monospace; color: #38bdf8; font-size: 12px; }
    .cmd-desc { font-size: 11px; color: #64748b; margin-top: 2px; }
    .copy-btn { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; padding: 3px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
    .copy-btn:hover { background: rgba(56, 189, 248, 0.25); }
    /* Memo */
    .memo-area { width: 100%; height: 160px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px; color: #f8fafc; font-size: 12px; outline: none; resize: none; user-select: text; }
    .memo-area:focus { border-color: #38bdf8; }
    .memo-hint { font-size: 11px; color: #64748b; margin-top: 6px; display: flex; justify-content: space-between; }
    /* Ping */
    .ping-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .ping-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 12px; outline: none; }
    .ping-btn { background: #0284c7; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .ping-btn:hover { background: #0369a1; }
    .ping-results { font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; min-height: 80px; color: #a5b4fc; }
    /* Timestamp */
    .ts-box { background: rgba(255,255,255,0.04); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; }
    .ts-now { font-family: monospace; color: #34d399; font-size: 14px; font-weight: bold; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('cmds')">⚡ 常用命令</button>
    <button class="tab-btn" onclick="switchTab('memo')">📝 随手便签</button>
    <button class="tab-btn" onclick="switchTab('ping')">🌐 网络诊断</button>
    <button class="tab-btn" onclick="switchTab('time')">⏱ 时间戳</button>
  </div>

  <!-- Tab 1: Commands -->
  <div id="tab-cmds" class="pane active">
    <div class="cmd-item">
      <div>
        <div class="cmd-text">docker ps --format "table {{.Names}}\t{{.Status}}"</div>
        <div class="cmd-desc">查看正在运行的容器简明表格</div>
      </div>
      <button class="copy-btn" onclick="copyText('docker ps --format &quot;table {{.Names}}\\t{{.Status}}&quot;')">复制</button>
    </div>
    <div class="cmd-item">
      <div>
        <div class="cmd-text">journalctl -xeu docker --no-pager -n 50</div>
        <div class="cmd-desc">查看服务最近 50 条系统日志</div>
      </div>
      <button class="copy-btn" onclick="copyText('journalctl -xeu docker --no-pager -n 50')">复制</button>
    </div>
    <div class="cmd-item">
      <div>
        <div class="cmd-text">df -hT --exclude-type=tmpfs</div>
        <div class="cmd-desc">查看真实磁盘分区占用率</div>
      </div>
      <button class="copy-btn" onclick="copyText('df -hT --exclude-type=tmpfs')">复制</button>
    </div>
    <div class="cmd-item">
      <div>
        <div class="cmd-text">ss -tulpn | grep LISTEN</div>
        <div class="cmd-desc">查看所有监听端口与关联进程</div>
      </div>
      <button class="copy-btn" onclick="copyText('ss -tulpn | grep LISTEN')">复制</button>
    </div>
  </div>

  <!-- Tab 2: Memo -->
  <div id="tab-memo" class="pane">
    <textarea id="memoText" class="memo-area" placeholder="在这里随手记下临时 IP、端口、密码或排错笔记，内容自动本地保存..."></textarea>
    <div class="memo-hint">
      <span>自动保存在浏览器本地</span>
      <span id="saveStatus">已同步</span>
    </div>
  </div>

  <!-- Tab 3: Ping -->
  <div id="tab-ping" class="pane">
    <div class="ping-row">
      <input id="pingUrl" class="ping-input" value="https://api.github.com" placeholder="输入测试 URL" />
      <button class="ping-btn" onclick="runPing()">测延迟</button>
    </div>
    <div id="pingLogs" class="ping-results">点击「测延迟」开始测试网络连通性...</div>
  </div>

  <!-- Tab 4: Time -->
  <div id="tab-time" class="pane">
    <div class="ts-box">
      <div>当前系统 UTC 时间:</div>
      <div id="utcTime" class="ts-now">--:--:--</div>
    </div>
    <div class="ts-box">
      <div>当前 Unix 时间戳 (秒):</div>
      <div id="unixSec" class="ts-now">0</div>
    </div>
    <div class="ts-box">
      <div>当前 Unix 时间戳 (毫秒):</div>
      <div id="unixMs" class="ts-now">0</div>
    </div>
  </div>

  <script>
    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + id).classList.add('active');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        const old = btn.innerText;
        btn.innerText = '已复制!';
        setTimeout(() => btn.innerText = old, 1200);
      });
    }

    // Memo storage
    const memo = document.getElementById('memoText');
    const saveStatus = document.getElementById('saveStatus');
    memo.value = localStorage.getItem('saki_toolbox_memo') || '';
    memo.addEventListener('input', () => {
      localStorage.setItem('saki_toolbox_memo', memo.value);
      saveStatus.innerText = '已保存 ' + new Date().toLocaleTimeString();
    });

    // Ping test
    async function runPing() {
      const url = document.getElementById('pingUrl').value.trim();
      const logs = document.getElementById('pingLogs');
      logs.innerText = '正在向 ' + url + ' 发起请求...\n';
      const start = performance.now();
      try {
        const res = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
        const dur = Math.round(performance.now() - start);
        logs.innerText += '✅ 响应成功！往返耗时: ' + dur + ' ms\n状态: 可达';
      } catch (err) {
        const dur = Math.round(performance.now() - start);
        logs.innerText += '⚠️ 探测已完成 (耗时约 ' + dur + ' ms)\n注意: 部分站点限制跨域 HEAD 请求，但 DNS 与链路可达。';
      }
    }

    // Clock ticker
    setInterval(() => {
      const now = new Date();
      const utcEl = document.getElementById('utcTime');
      const secEl = document.getElementById('unixSec');
      const msEl = document.getElementById('unixMs');
      if (utcEl) utcEl.innerText = now.toUTCString();
      if (secEl) secEl.innerText = Math.floor(now.getTime() / 1000);
      if (msEl) msEl.innerText = now.getTime();
    }, 1000);
  </script>
</body>
</html>
