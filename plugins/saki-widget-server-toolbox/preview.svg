<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="toolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#toolBg)" />

  <!-- Title bar -->
  <rect x="0" y="0" width="400" height="38" rx="16" fill="rgba(255,255,255,0.06)" />
  <circle cx="20" cy="19" r="5" fill="#f43f5e" opacity="0.8" />
  <circle cx="36" cy="19" r="5" fill="#fbbf24" opacity="0.8" />
  <circle cx="52" cy="19" r="5" fill="#34d399" opacity="0.8" />
  <text x="75" y="23" fill="#38bdf8" font-size="12" font-family="system-ui, sans-serif" font-weight="600">🧰 Saki Server Toolbox</text>

  <!-- Content Tabs Mock -->
  <rect x="18" y="48" width="70" height="22" rx="6" fill="rgba(56, 189, 248, 0.2)" />
  <text x="28" y="63" fill="#38bdf8" font-size="11" font-family="system-ui" font-weight="600">⚡ 常用命令</text>

  <rect x="94" y="48" width="70" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" />
  <text x="104" y="63" fill="#94a3b8" font-size="11" font-family="system-ui">📝 随手便签</text>

  <rect x="170" y="48" width="70" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" />
  <text x="180" y="63" fill="#94a3b8" font-size="11" font-family="system-ui">🌐 网络诊断</text>

  <!-- Command Cards -->
  <g transform="translate(18, 80)">
    <rect width="364" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
    <text x="12" y="20" fill="#38bdf8" font-size="11" font-family="monospace">docker ps --format "table {{.Names}}\t{{.Status}}"</text>
    <text x="12" y="34" fill="#64748b" font-size="9" font-family="system-ui">查看正在运行的容器简明表格</text>
    <rect x="312" y="10" width="40" height="22" rx="4" fill="rgba(56,189,248,0.2)" />
    <text x="322" y="25" fill="#38bdf8" font-size="10" font-family="system-ui">复制</text>
  </g>

  <g transform="translate(18, 130)">
    <rect width="364" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
    <text x="12" y="20" fill="#38bdf8" font-size="11" font-family="monospace">journalctl -xeu docker --no-pager -n 50</text>
    <text x="12" y="34" fill="#64748b" font-size="9" font-family="system-ui">查看服务最近 50 条系统日志</text>
    <rect x="312" y="10" width="40" height="22" rx="4" fill="rgba(56,189,248,0.2)" />
    <text x="322" y="25" fill="#38bdf8" font-size="10" font-family="system-ui">复制</text>
  </g>

  <g transform="translate(18, 180)">
    <rect width="364" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
    <text x="12" y="20" fill="#38bdf8" font-size="11" font-family="monospace">ss -tulpn | grep LISTEN</text>
    <text x="12" y="34" fill="#64748b" font-size="9" font-family="system-ui">查看所有监听端口与关联进程</text>
    <rect x="312" y="10" width="40" height="22" rx="4" fill="rgba(56,189,248,0.2)" />
    <text x="322" y="25" fill="#38bdf8" font-size="10" font-family="system-ui">复制</text>
  </g>
</svg>
